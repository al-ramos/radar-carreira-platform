name: Validar e publicar o Radar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar build
        run: npm run build
      - name: Validar código
        run: npm run lint
      - name: Executar testes
        run: node --test tests/*.test.mjs
      - name: Validar integração de permissões
        run: npm run test:rbac-integration

  deploy:
    name: Publicar no Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RADAR_CODEX_MCP_TOKEN: ${{ secrets.RADAR_CODEX_MCP_TOKEN }}
      GMAIL_DRAFTS_WEBHOOK_URL: ${{ secrets.GMAIL_DRAFTS_WEBHOOK_URL }}
      GMAIL_DRAFTS_WEBHOOK_TOKEN: ${{ secrets.GMAIL_DRAFTS_WEBHOOK_TOKEN }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detectar migrations alteradas
        id: migrations
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- drizzle/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Normalizar credenciais do Cloudflare
        shell: bash
        run: |
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n')" >> "$GITHUB_ENV"
      - name: Aplicar migrations D1 pendentes
        if: steps.migrations.outputs.changed == 'true'
        run: npx wrangler d1 migrations apply radar-carreira-db --remote
      - name: Garantir filas da triagem
        shell: bash
        run: |
          npx wrangler queues create radar-carreira-triage-manual || true
          npx wrangler queues create radar-carreira-triage-manual-dlq || true
          npx wrangler queues create radar-carreira-triage || true
          npx wrangler queues create radar-carreira-triage-dlq || true
          npx wrangler queues create radar-carreira-ai-review || true
          npx wrangler queues create radar-carreira-ai-review-dlq || true
      - name: Gerar Worker de produção
        run: npm run build
      - name: Configurar acesso privado do Codex
        shell: bash
        run: |
          if [ -z "$RADAR_CODEX_MCP_TOKEN" ]; then
            echo "RADAR_CODEX_MCP_TOKEN não configurado nos secrets do repositório." >&2
            exit 1
          fi
          printf '%s' "$RADAR_CODEX_MCP_TOKEN" | npx wrangler secret put RADAR_CODEX_MCP_TOKEN
          if [ -z "$GMAIL_DRAFTS_WEBHOOK_URL" ] || [ -z "$GMAIL_DRAFTS_WEBHOOK_TOKEN" ]; then
            echo "Conector Gmail imediato não configurado; a publicação foi bloqueada para não desativar rascunhos automáticos silenciosamente." >&2
            exit 1
          fi
          printf '%s' "$GMAIL_DRAFTS_WEBHOOK_URL" | npx wrangler secret put GMAIL_DRAFTS_WEBHOOK_URL
          printf '%s' "$GMAIL_DRAFTS_WEBHOOK_TOKEN" | npx wrangler secret put GMAIL_DRAFTS_WEBHOOK_TOKEN
      - name: Publicar Worker
        run: npx wrangler deploy
