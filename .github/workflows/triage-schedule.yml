name: Triagem agendada (APInfo)

# Etapa 1 da automação ponta a ponta: avalia por regras (e IA só para casos
# ambíguos) as vagas da extensão APInfo, de hora em hora em horário
# comercial. Não cria rascunho nesta etapa — a rota só enfileira quando o
# interruptor "Rascunho automático da triagem agendada" está ligado em
# Configurações, e esse interruptor começa desligado por padrão.
on:
  schedule:
    - cron: "0 11-22 * * *" # 08h–19h em São Paulo (UTC-3), todos os dias
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rodar triagem agendada da APInfo
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
        run: |
          test -n "${RADAR_BASE_URL}"
          response=$(curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${COLLECTOR_SECRET}" \
            -H "content-type: application/json" \
            -d '{"trigger":"schedule","sourceId":"apinfo-extension","dateScope":"received","aiMode":"ambiguous"}' \
            "${RADAR_BASE_URL}/api/triage/run")
          echo "$response"
          jq -e '.ok == true' >/dev/null <<< "$response"
