name: Coleta diária de vagas
on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Coletar fontes ativas
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
        run: |
          test -n "${RADAR_BASE_URL}"
          collect_errors=0
          offset=0
          while true; do
            response=$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 90 --max-time 120 \
              -X POST \
              -H "Authorization: Bearer ${COLLECTOR_SECRET}" \
              "${RADAR_BASE_URL}/api/cron/collect?offset=${offset}")
            echo "$response"
            if [ "$(jq -r '.ok' <<< "$response")" != "true" ]; then collect_errors=1; fi
            offset=$(jq -r '.nextOffset // empty' <<< "$response")
            [ -z "$offset" ] && break
            # Evita saturar o Worker/D1 ao iniciar muitas fontes em sequência.
            sleep 1
          done
          [ "$collect_errors" -eq 0 ]
          for endpoint in /api/cron/enrich /api/cron/lifecycle; do
            response=$(curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 90 --max-time 120 -X POST -H "Authorization: Bearer ${COLLECTOR_SECRET}" "${RADAR_BASE_URL}${endpoint}")
            echo "$response"
            jq -e '.ok == true' >/dev/null <<< "$response"
          done
