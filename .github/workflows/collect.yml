name: Coleta diária de vagas
on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Coletar fontes ativas
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
        run: |
          curl --fail-with-body --retry 2 --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${COLLECTOR_SECRET}" \
            https://radar-carreira-platform.jazzy-siren-4604.chatgpt.site/api/cron/collect
          curl --fail-with-body --retry 2 --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${COLLECTOR_SECRET}" \
            https://radar-carreira-platform.jazzy-siren-4604.chatgpt.site/api/cron/enrich
