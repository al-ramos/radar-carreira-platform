name: Coleta diária de vagas
on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Coletar fontes ativas
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
        run: |
          test -n "${RADAR_BASE_URL}"
          call_api() {
            response=$(curl --fail-with-body --retry 2 --max-time 300 \
              -X POST \
              -H "Authorization: Bearer ${COLLECTOR_SECRET}" \
              "${RADAR_BASE_URL}$1")
            echo "$response"
            jq -e '.ok == true' >/dev/null <<< "$response"
          }
          call_api "/api/cron/collect"
          call_api "/api/cron/enrich"
          call_api "/api/cron/lifecycle"
