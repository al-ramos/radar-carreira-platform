name: Coleta diária de vagas
on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
    inputs:
      start_offset:
        description: "Ponto inicial da coleta para retomada manual"
        required: false
        default: "0"
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Coletar fontes ativas
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
        run: |
          test -n "${RADAR_BASE_URL}"
          collect_errors=0
          offset="${{ inputs.start_offset || '0' }}"
          while true; do
            if ! response=$(curl --silent --show-error --fail-with-body --retry 6 --retry-all-errors --retry-delay 15 --retry-max-time 120 --max-time 120 \
              -X POST \
              -H "Authorization: Bearer ${COLLECTOR_SECRET}" \
              "${RADAR_BASE_URL}/api/cron/collect?offset=${offset}"); then
              # Um 503/1102 de uma fonte não pode encerrar as fontes restantes.
              # A fonte é tentada novamente na próxima rodada (ou por start_offset),
              # enquanto as demais ainda coletam, enriquecem e entram na triagem.
              echo "Falha transitória ao coletar a fonte no offset ${offset}; continuando a rodada." >&2
              collect_errors=1
              offset=$((offset + 1))
              sleep 1
              continue
            fi
            echo "$response"
            if ! jq -e '.ok == true' >/dev/null <<< "$response"; then
              echo "Resposta inválida da coleta no offset ${offset}; continuando a rodada." >&2
              collect_errors=1
              offset=$((offset + 1))
              sleep 1
              continue
            fi
            offset=$(jq -r '.nextOffset // empty' <<< "$response")
            [ -z "$offset" ] && break
            sleep 1
          done
          # --fail-with-body: sem isso o corpo da resposta era descartado e o log
          # so mostrava "curl: (22) ... error: 503", sem o motivo que a rota
          # devolveu. Quatro dias de coleta vermelha custaram esse detalhe.
          for endpoint in /api/cron/enrich /api/cron/lifecycle; do
            response=$(curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors --retry-delay 15 --max-time 120 -X POST -H "Authorization: Bearer ${COLLECTOR_SECRET}" "${RADAR_BASE_URL}${endpoint}")
            echo "$response"
            jq -e '.ok == true' >/dev/null <<< "$response"
          done
          [ "$collect_errors" -eq 0 ]
